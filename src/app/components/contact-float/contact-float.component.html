<div class="contact-float" aria-label="Quick contact">
  <a
    class="float-btn float-btn--call"
    [href]="telHref"
    aria-label="Call Nizam Jewellers"
  >
    <i class="fa-solid fa-phone" aria-hidden="true"></i>
    <span class="float-label">Call</span>
  </a>
  <a
    class="float-btn float-btn--wa"
    [href]="whatsAppHref"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Chat on WhatsApp"
  >
    <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
    <span class="float-label">WhatsApp</span>
  </a>
</div>
