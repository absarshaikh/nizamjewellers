<section class="hero-banner" aria-label="Welcome">

  <div class="hero-media">
    <video
      autoplay
      loop
      playsinline
      muted
      #videoRef
      class="hero-video"
    >
      <source src="assets/images/jewelry.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay" aria-hidden="true"></div>
  </div>

  <div class="hero-content">
    <p class="type-eyebrow hero-eyebrow">Mumbai · Workshop to you</p>

    <h1 class="NizamJw text-hero text-gold hero-title">
      Nizam Jewellers
    </h1>

    <p class="type-lead hero-tagline">
      Crafted in our workshop. No showroom markup.
    </p>

    <div class="hero-actions">
      <a routerLink="/products" class="hero-btn hero-btn--primary">
        Browse collections
      </a>
      <a routerLink="/try-diamond" class="hero-btn hero-btn--ghost">
        Try diamond size
      </a>
      <a routerLink="/custom-design" class="hero-btn hero-btn--ghost">
        Design your own
      </a>
    </div>
  </div>

  <span class="hero-scroll-hint type-caption" aria-hidden="true">Scroll</span>
</section>

<section class="hero-gallery">
    <div class="hero-gallery-inner relative overflow-hidden">

  <div class="flex transition-transform duration-700"
       [style.transform]="'translateX(-' + currentIndex * (100 / itemsPerView) + '%)'">

    <div *ngFor="let img of images"
         [style.minWidth.%]="100 / itemsPerView"
         class="flex-shrink-0">

      <div class="px-3">
        <img [src]="img"
             class="gallery-slide-img" alt="" />
      </div>

    </div>

  </div>

  <!-- Controls -->
  <button (click)="prev()"
    class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/40 px-3 py-2 rounded-full">
    ‹
  </button>

  <button (click)="next()"
    class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/40 px-3 py-2 rounded-full">
    ›
  </button>

</div>
</section>
<section class="products-section bg-navy py-12 md:py-16 px-4 sm:px-6">

  <div class="max-w-7xl mx-auto text-center mb-8 md:mb-10">
    <p class="type-eyebrow mb-2">Collections</p>
    <h2 class="type-page-title">Our Products</h2>
    <p class="type-lead mt-3 max-w-lg mx-auto">
      Choose a category to browse designs, then customise your piece on the detail page.
    </p>
    <a
      routerLink="/products"
      class="inline-block mt-4 type-body-sm font-semibold text-gold hover:underline">
      View full catalogue →
    </a>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-6 max-w-7xl mx-auto">

    <app-product-card
      *ngFor="let product of products"
      [product]="product">
    </app-product-card>

  </div>

</section>
